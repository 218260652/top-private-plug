databases:
  - name: top-private-plug-test-db
    databaseName: top_private_plug_test_db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
services:
  - type: web
    name: top-private-plug-test-api
    runtime: python
    repo: https://github.com/218260652/top-private-plug
    branch: develop/customer-auth-staging
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.lock
    startCommand: python -m backend.hosted
    envVars:
      - key: TPP_CUSTOMER_STAGING
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: top-private-plug-test-db
          property: connectionString
      - key: TPP_MIGRATION_URL
        fromDatabase:
          name: top-private-plug-test-db
          property: connectionString
      - key: TPP_BOOTSTRAP_PASSWORD
        sync: false
