services:
  https:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      TPP_ADMIN_HOST: ${TPP_ADMIN_HOST:?Set TPP_ADMIN_HOST}
      TPP_VPN_HOST: ${TPP_VPN_HOST:?Set TPP_VPN_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
  service:
    build: ..
    restart: unless-stopped
    init: true
    network_mode: host
    depends_on: [https]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    devices: [/dev/net/tun:/dev/net/tun]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    environment:
      TPP_DB: /data/tpp.sqlite3
      TPP_PUBLIC_ORIGIN: https://${TPP_ADMIN_HOST}
      TPP_HTTP_BIND: 127.0.0.1
      TPP_HTTP_PORT: "8080"
      TPP_GATEWAY_BIND: 0.0.0.0
      TPP_GATEWAY_PORT: ${TPP_GATEWAY_PORT:-8443}
      TPP_TLS_CERT: /certificates/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${TPP_VPN_HOST}/${TPP_VPN_HOST}.crt
      TPP_TLS_KEY: /certificates/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${TPP_VPN_HOST}/${TPP_VPN_HOST}.key
    volumes:
      - accounts:/data
      - certificates:/certificates:ro
volumes:
  accounts:
  certificates:
  caddy_config:
