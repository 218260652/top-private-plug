name: Network binding backend checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tpp_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: tpp_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --check backend/static/admin.js
      - name: Verify entitlement migration and binding on PostgreSQL
        env:
          DATABASE_URL: postgresql://tpp_test:isolated_ci_only@127.0.0.1:5432/tpp_test
        run: python tools/verify_postgres.py --from-env
