name: Checks and pilot APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock
      - name: Test backend and TLS gateway
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript and network script
        run: |
          node --check backend/static/admin.js
          bash -n deploy/configure-network.sh
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android cancellation with blocked native startup and shutdown
        run: python -m unittest tests.test_android_lifecycle tests.test_android_access tests.test_connection_report tests.test_control_policy tests.test_api_tunnel_route -v
      - name: Preserve pilot signing identity
        uses: actions/cache@v4
        with:
          path: .local-signing
          key: top-private-plug-debug-pilot-signing-v1
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check out pinned Xray Android engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: 76a6e2172210613fcb4aa32b6de55bcd9452ce43
          path: .xray-source
          persist-credentials: false
      - name: Set up Go for pinned engine
        uses: actions/setup-go@v6
        with:
          go-version-file: .xray-source/go.mod
          cache-dependency-path: .xray-source/go.sum
      - name: Build native Xray engine
        run: |
          python tools/prepare_xray_compat.py --source .xray-source
          python tools/verify_xray_chain.py --source .xray-source
          bash tools/build_xray.sh
      - name: Reproduce Android interface permission restriction
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          python tools/verify_android_tun.py --source .xray-source
      - name: Build and verify debug-signed pilot
        # Exercise real loopback sockets separately from the denied-socket parser test.
        run: |
          python tools/build_android.py --sdk "$ANDROID_HOME"
      - name: Package rebuild sources and licenses
        run: |
          tar --exclude=.git --exclude=.local-signing --exclude='*.aar' --exclude='*.apk' --exclude='android/build' --exclude='__pycache__' -czf /tmp/Top-private-Plug-rebuild-source.tar.gz .
          cp /tmp/Top-private-Plug-rebuild-source.tar.gz .
      - name: Publish verified pilot as a GitHub Release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="pilot-0.1.13-${SOURCE_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zip -j Top-private-Plug-0.1.13-pilot.zip Top-private-Plug-0.1.13-pilot.apk
          sha256sum Top-private-Plug-*-pilot.apk Top-private-Plug-*-pilot.zip Top-private-Plug-rebuild-source.tar.gz > SHA256SUMS
          gh release create "$tag" --target "$SOURCE_SHA" --title "Top private Plug 0.1.13 pilot" --prerelease --notes "Reuse HTTPS account connections instead of forcing separate upstream proxy connections. Report upstream proxy 429 and 503 accurately and pause retries for 30 seconds. Manual Wi-Fi profile refresh replaces cached configurations. Carrier zero-data connectivity still requires a phone test."
          gh release upload "$tag" Top-private-Plug-*-pilot.apk Top-private-Plug-*-pilot.zip Top-private-Plug-rebuild-source.tar.gz SHA256SUMS
          gh release view "$tag" --json url --jq .url
      - name: Save pilot APK
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Top-private-Plug-pilot-${{ github.run_number }}
          path: |
            Top-private-Plug-*-pilot.apk
            Top-private-Plug-rebuild-source.tar.gz
          if-no-files-found: error
          retention-days: 1




