name: Checks and pilot APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pilot:
        description: 'Publish prerelease only after explicit owner approval'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock
      - name: Test backend and TLS gateway
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript and network script
        run: |
          node --check backend/static/admin.js
          bash -n deploy/configure-network.sh
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android cancellation with blocked native startup and shutdown
        run: python -m unittest tests.test_android_lifecycle tests.test_android_access tests.test_connection_report tests.test_control_policy tests.test_api_tunnel_route tests.test_premium_policy tests.test_reconnect tests.test_traffic_totals -v
      - name: Preserve pilot signing identity
        uses: actions/cache@v4
        with:
          path: .local-signing
          key: top-private-plug-debug-pilot-signing-v1
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check out pinned Xray Android engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: 76a6e2172210613fcb4aa32b6de55bcd9452ce43
          path: .xray-source
          persist-credentials: false
      - name: Set up Go for pinned engine
        uses: actions/setup-go@v6
        with:
          go-version-file: .xray-source/go.mod
          cache-dependency-path: .xray-source/go.sum
      - name: Build native Xray engine
        run: |
          python tools/prepare_xray_compat.py --source .xray-source
          python tools/verify_xray_chain.py --source .xray-source
          bash tools/build_xray.sh
      - name: Reproduce Android interface permission restriction
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          python tools/verify_android_tun.py --source .xray-source
      - name: Build and verify debug-signed pilot
        # Exercise real loopback sockets separately from the denied-socket parser test.
        run: |
          python tools/build_android.py --sdk "$ANDROID_HOME"
      - name: Verify update identity against working 0.1.17 pilot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 41518020694 -n Top-private-Plug-pilot-67 -D /tmp/tpp-baseline
          python tools/verify_update_identity.py /tmp/tpp-baseline/Top-private-Plug-0.1.17-pilot.apk Top-private-Plug-0.1.18-pilot.apk
      - name: Capture and verify native phone interfaces
        run: |
          sudo chmod a+rw /dev/kvm
          # Native compilation is complete; reclaim its disposable compiler cache.
          go clean -cache
          rm -rf "$ANDROID_HOME/ndk"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tpp-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' > /tmp/emulator-install.log
          echo no | avdmanager create avd -n premium-ui -k 'system-images;android-35;google_apis;x86_64' --device pixel_6 -p "$ANDROID_AVD_HOME/premium-ui.avd"
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/premium-ui.avd/config.ini"
          echo 'disk.dataPartition.size=2048M' >> "$ANDROID_AVD_HOME/premium-ui.avd/config.ini"
          df -h /
          "$ANDROID_HOME/emulator/emulator" -avd premium-ui -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -partition-size 2048 -no-metrics -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done' || { cat /tmp/emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          python tools/verify_premium_ui.py
          adb emu kill
      - name: Package rebuild sources and licenses
        run: |
          tar --exclude=.git --exclude=.local-signing --exclude='*.aar' --exclude='*.apk' --exclude='android/build' --exclude='android/ui-build' --exclude='ui-screenshots' --exclude='*.zip' --exclude='__pycache__' -czf /tmp/Top-private-Plug-rebuild-source.tar.gz .
          cp /tmp/Top-private-Plug-rebuild-source.tar.gz .
      - name: Publish verified pilot as a GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pilot == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="pilot-0.1.18-${SOURCE_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zip -j Top-private-Plug-0.1.18-pilot.zip Top-private-Plug-0.1.18-pilot.apk
          sha256sum Top-private-Plug-*-pilot.apk Top-private-Plug-*-pilot.zip Top-private-Plug-rebuild-source.tar.gz Top-private-Plug-0.1.18-ui-screenshots.zip > SHA256SUMS
          gh release create "$tag" --target "$SOURCE_SHA" --title "Top private Plug 0.1.18 pilot" --prerelease --notes "Fixes PostgreSQL usage refresh for active shared trials and tests 10 GB accounting without duplicate charging. Samples tunnel traffic every second and syncs counters every five seconds. Adds a black interface, clear stale-balance state and customer-safe messages without server credentials. Preserves MTN, Telkom and Cell C, account authorization and certificate checks. Physical-device carrier validation is still required."
          gh release upload "$tag" Top-private-Plug-*-pilot.apk Top-private-Plug-*-pilot.zip Top-private-Plug-rebuild-source.tar.gz Top-private-Plug-0.1.18-ui-screenshots.zip SHA256SUMS
          gh release view "$tag" --json url --jq .url
      - name: Save pilot APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Top-private-Plug-pilot-${{ github.run_number }}
          path: |
            Top-private-Plug-*-pilot.apk
            Top-private-Plug-rebuild-source.tar.gz
            Top-private-Plug-0.1.18-ui-screenshots.zip
            ui-screenshots/*.png
            update-compatibility.json
          if-no-files-found: error
          retention-days: 7








