name: Customer staging checks and test APK

on:
  push:
    branches: [develop/customer-auth-staging, develop/cell-c-code]
  pull_request:
    branches: [develop/cell-c-code]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: >-
      github.repository == '218260652/top-private-plug' &&
      (github.ref == 'refs/heads/develop/customer-auth-staging' ||
       github.ref == 'refs/heads/develop/cell-c-code' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: top_private_plug_test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Test backend and dashboard
        env:
          TPP_TEST_POSTGRES: postgresql://postgres:ci-only@127.0.0.1/top_private_plug_test_db
        run: |
          python -m pip install -r requirements.lock
          python -m unittest discover -s tests -v
          node --check backend/static/admin.js
          node --check backend/static/customers.js
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check out the pinned Xray Android engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: 76a6e2172210613fcb4aa32b6de55bcd9452ce43
          path: .xray-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .xray-source/go.mod
          cache-dependency-path: .xray-source/go.sum
      - name: Build and verify Xray
        run: |
          python tools/prepare_xray_compat.py --source .xray-source
          python tools/verify_xray_chain.py --source .xray-source
          bash tools/build_xray.sh
          sudo apt-get install -y strace
          python tools/verify_android_tun.py --source .xray-source
      - name: Restore staging signing identity
        uses: actions/cache@v4
        with:
          path: .local-signing/customer-test
          key: tpp-customer-test-signing-v1
      - name: Build and verify signed test APK
        env:
          TPP_BUNDLED_MOBILE_VLESS: ${{ secrets.TPP_BUNDLED_MOBILE_VLESS }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            test -f .local-signing/customer-test/debug.keystore
          fi
          python tools/build_android.py --customer-test
          apk=Top-Private-Plug-0.2.13.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" > APK-METADATA.txt
          grep -F "package: name='za.co.topprivateplug.test' versionCode='50' versionName='0.2.13'" APK-METADATA.txt
          grep -F "application-label:'Top Private Plug'" APK-METADATA.txt
          git rev-parse HEAD >> APK-METADATA.txt
          sha256sum "$apk" | tee SHA256SUMS
