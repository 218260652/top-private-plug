name: Oracle provisioner tests
on:
  push:
    paths: ['infra/oracle/**', '.github/workflows/oracle-tests.yml', '.github/workflows/oracle-provision.yml']
  pull_request:
    paths: ['infra/oracle/**', '.github/workflows/oracle-tests.yml', '.github/workflows/oracle-provision.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r infra/oracle/requirements.txt
      - run: python -m unittest discover -s infra/oracle -p 'test_*.py' -v
